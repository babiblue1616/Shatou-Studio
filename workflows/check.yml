name: 微博监控推送

on:
  schedule:
    # 每5分钟运行一次（GitHub Actions的cron是UTC时间，但这里用间隔触发不受时区影响）
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # 允许手动点击运行，方便测试

# 允许脚本提交"已推送记录"文件回仓库，避免重复推送
permissions:
  contents: write

jobs:
  check-weibo:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 运行监控脚本
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_TOPIC_ID: ${{ secrets.WXPUSHER_TOPIC_ID }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: python main.py

      - name: 保存推送记录（防止重复推送）
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sent_ids.json
          git diff --staged --quiet || git commit -m "更新推送记录 [skip ci]"
          git push
